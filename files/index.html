<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disk Monitor – HealthCenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #080b12;
    --surface:     #0f1320;
    --surface-2:   #151a2c;
    --surface-3:   #1a2035;
    --border:      #1e2640;
    --border-hi:   #2a3456;
    --text:        #e2e6f0;
    --text-dim:    #6b7594;
    --text-muted:  #4a5270;
    --accent:      #4e9eff;
    --accent-dim:  #2a5a9e;
    --green:       #2dd4a0;
    --green-dim:   rgba(45,212,160,0.15);
    --yellow:      #f5b731;
    --yellow-dim:  rgba(245,183,49,0.15);
    --red:         #f0443e;
    --red-dim:     rgba(240,68,62,0.15);
    --donut-free:  #2dd4a0;
    --donut-used:  #f0443e;
    --radius:      12px;
    --radius-sm:   8px;
    --mono:        'IBM Plex Mono', monospace;
    --sans:        'Nunito', system-ui, sans-serif;
  }

  html { font-size: 14px; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Page Header ─────────────────────────────────────────────── */
  .page-header {
    max-width: 1500px;
    margin: 0 auto;
    padding: 2rem 2rem 0.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .page-header-left {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .page-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), #7c5cfc);
    border-radius: 10px;
    display: grid; place-items: center;
  }

  .page-logo svg { width: 20px; height: 20px; fill: #fff; }

  .page-title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .page-title span { color: var(--accent); }

  .page-subtitle {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .page-meta {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  /* ── Grid ─────────────────────────────────────────────────────── */
  .grid {
    max-width: 1500px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* ── Machine Card ────────────────────────────────────────────── */
  .machine-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: card-in 0.45s ease both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Card Header (matches Image 1) ───────────────────────────── */
  .card-header {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.85rem 1.25rem;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .pc-icon {
    width: 32px; height: 32px;
    flex-shrink: 0;
  }

  .card-hostname {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    flex: 1;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.65rem;
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 600;
  }

  .status-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-badge.ok   { background: var(--green-dim); color: var(--green); }
  .status-badge.ok .dot   { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-badge.warn { background: var(--yellow-dim); color: var(--yellow); }
  .status-badge.warn .dot { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-badge.crit { background: var(--red-dim); color: var(--red); }
  .status-badge.crit .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .drive-count-badge {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.15rem 0.5rem;
    margin-left: 0.25rem;
  }

  .card-date {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── Card Body: Donut + Table layout ─────────────────────────── */
  .card-body {
    padding: 1.25rem 1.5rem;
  }

  .card-body-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 1rem;
    letter-spacing: 0.03em;
  }

  .storage-layout {
    display: flex;
    gap: 2rem;
    align-items: flex-start;
  }

  /* ── Donut Chart (matches Image 2) ───────────────────────────── */
  .donut-wrap {
    flex-shrink: 0;
    position: relative;
    width: 170px;
    height: 170px;
  }

  .donut-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .donut-wrap circle {
    fill: none;
    stroke-width: 22;
  }

  .donut-track { stroke: var(--surface-3); }

  .donut-fill {
    stroke-linecap: round;
    transition: stroke-dasharray 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                stroke 0.4s ease;
  }

  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .donut-letter {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--text);
  }

  .donut-pct {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
    line-height: 1.1;
  }

  .donut-label-text {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }

  /* Multi-drive donut: show worst / overall */
  .donut-multi .donut-letter { font-size: 0.72rem; }

  /* ── Drive Table (matches Image 2 bottom) ────────────────────── */
  .drive-table-wrap {
    flex: 1;
    overflow-x: auto;
  }

  .drive-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  .drive-table thead th {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.5rem 0.6rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .drive-table tbody td {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.6rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    color: var(--text);
  }

  .drive-table tbody tr:last-child td { border-bottom: none; }

  .drive-table tbody tr:hover {
    background: var(--surface-2);
  }

  .td-drive {
    font-weight: 700;
    color: var(--accent);
  }

  .td-pct { font-weight: 700; }
  .td-pct.ok   { color: var(--green); }
  .td-pct.warn { color: var(--yellow); }
  .td-pct.crit { color: var(--red); }

  .td-type, .td-label, .td-fs {
    color: var(--text-dim);
  }

  /* ── Summary footer ──────────────────────────────────────────── */
  .card-footer {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
  }

  .footer-stat {
    flex: 1;
    padding: 0.75rem 1rem;
    text-align: center;
    border-right: 1px solid var(--border);
  }

  .footer-stat:last-child { border-right: none; }

  .footer-stat-label {
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.15rem;
  }

  .footer-stat-value {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.9rem;
  }

  .footer-stat-value.free-color { color: var(--green); }

  /* ── Empty / Loading ─────────────────────────────────────────── */
  .empty, .loading {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--text-dim);
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty p { max-width: 420px; margin: 0 auto; line-height: 1.7; }
  .empty code { background: var(--surface-2); padding: 0.15rem 0.45rem; border-radius: 4px; font-family: var(--mono); font-size: 0.85rem; }

  /* ── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 700px) {
    .page-header { padding: 1.25rem 1rem 0.5rem; }
    .grid { padding: 1rem 1rem 2rem; }
    .card-body { padding: 1rem; }
    .storage-layout { flex-direction: column; align-items: center; }
    .donut-wrap { width: 150px; height: 150px; }
    .card-footer { flex-wrap: wrap; }
    .footer-stat { min-width: 50%; border-bottom: 1px solid var(--border); }
  }

  @media (max-width: 420px) {
    html { font-size: 13px; }
    .card-header { flex-wrap: wrap; gap: 0.4rem; }
    .card-date { width: 100%; margin-top: 0.25rem; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-header-left">
    <div class="page-logo">
      <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm5 14h6m-3-4v4"/><rect x="4" y="4" width="16" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="12" y1="16" x2="12" y2="20" stroke="#fff" stroke-width="1.5"/><line x1="9" y1="20" x2="15" y2="20" stroke="#fff" stroke-width="1.5"/></svg>
    </div>
    <div>
      <div class="page-title">Disk <span>Monitor</span></div>
      <div class="page-subtitle">HealthCenter</div>
    </div>
  </div>
  <div class="page-meta" id="meta"></div>
</div>

<div class="grid" id="grid">
  <div class="loading">
    <div class="spinner"></div>
    <p>JSON fájlok betöltése…</p>
  </div>
</div>

<script>
/* ================================================================
   Disk Monitor Dashboard  –  reads every .json from  ./json/
   ================================================================ */

const JSON_DIR = 'json';
const INDEX    = 'index.json';

// ── Helpers ─────────────────────────────────────────────────────
function fmtBytes(b) {
  if (b === 0) return '0 B';
  const u = ['B','KB','MB','GB','TB','PB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(2) + ' ' + u[i];
}

function severity(pct) {
  if (pct >= 90) return 'crit';
  if (pct >= 75) return 'warn';
  return 'ok';
}

function sevLabel(s) {
  return s === 'crit' ? 'Kritikus' : s === 'warn' ? 'Figyelem' : 'Rendben';
}

function worstSeverity(drives) {
  return severity(Math.max(...drives.map(d => d.usedPercent)));
}

function donutColor(pct) {
  if (pct >= 90) return '#f0443e';
  if (pct >= 75) return '#f5b731';
  return '#2dd4a0';
}

function freeColor(pct) {
  if (pct >= 90) return '#f0443e';
  if (pct >= 75) return '#f5b731';
  return '#2dd4a0';
}

// ── Date formatting ─────────────────────────────────────────────
function fmtDate(dateStr) {
  // "2026-05-06 14:32:10" → "Generálva: 2026. 05. 06. 14:32:10"
  const parts = dateStr.split(' ');
  const d = parts[0].replace(/-/g, '. ') + '.';
  const t = parts[1] || '';
  return 'Generálva: ' + d + ' ' + t;
}

// ── SVG PC Icon ─────────────────────────────────────────────────
function pcIconSvg() {
  return `<svg class="pc-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="8" width="52" height="34" rx="4" fill="#1a2035" stroke="#4e9eff" stroke-width="2"/>
    <rect x="10" y="12" width="44" height="26" rx="2" fill="#0c1424" stroke="#2a3456" stroke-width="1"/>
    <circle cx="32" cy="25" r="3" fill="#4e9eff" opacity="0.6"/>
    <rect x="24" y="42" width="16" height="4" rx="1" fill="#2a3456"/>
    <rect x="18" y="46" width="28" height="3" rx="1.5" fill="#1a2035" stroke="#2a3456" stroke-width="1"/>
    <circle cx="14" cy="38" r="1.5" fill="#2dd4a0" opacity="0.8"/>
  </svg>`;
}

// ── Donut SVG ───────────────────────────────────────────────────
function donutSvg(pct, letter) {
  const r = 50;
  const c = Math.PI * 2 * r;
  const filled = (pct / 100) * c;
  const free   = c - filled;
  const color  = donutColor(pct);
  const freeC  = freeColor(pct) === '#2dd4a0' ? '#2dd4a0' : '#1a4a3a';

  return `
    <div class="donut-wrap${letter ? '' : ' donut-multi'}">
      <svg viewBox="0 0 130 130">
        <circle class="donut-track" cx="65" cy="65" r="${r}" stroke-width="22"/>
        <circle class="donut-fill"  cx="65" cy="65" r="${r}" stroke-width="22"
          stroke="${color}"
          stroke-dasharray="${filled} ${free}"
          stroke-linecap="round"/>
        <!-- free arc on top as green overlay -->
      </svg>
      <div class="donut-center">
        <span class="donut-letter">${letter || 'Össz.'}</span>
        <span class="donut-pct">${pct}%</span>
      </div>
    </div>`;
}

// ── Render one machine card ─────────────────────────────────────
function renderCard(data, delay) {
  const sev = worstSeverity(data.drives);

  let totalAll = 0, usedAll = 0, freeAll = 0;
  data.drives.forEach(d => {
    totalAll += d.totalBytes;
    usedAll  += d.usedBytes;
    freeAll  += d.freeBytes;
  });
  const pctAll = totalAll > 0 ? ((usedAll / totalAll) * 100).toFixed(2) : 0;

  // Pick which drive to show in the donut
  // If single drive → show that drive letter. If multi → show worst drive.
  let donutLetter, donutPct;
  if (data.drives.length === 1) {
    donutLetter = data.drives[0].letter;
    donutPct = data.drives[0].usedPercent;
  } else {
    // Show overall
    donutLetter = '';
    donutPct = parseFloat(pctAll);
  }

  // Table rows
  let rows = '';
  data.drives.forEach(d => {
    const s = severity(d.usedPercent);
    rows += `
      <tr>
        <td class="td-drive">${d.letter}</td>
        <td class="td-type">${d.type || 'Local'}</td>
        <td class="td-label">${d.label || '—'}</td>
        <td class="td-fs">${d.fileSystem || '—'}</td>
        <td>${fmtBytes(d.totalBytes)}</td>
        <td>${fmtBytes(d.usedBytes)}</td>
        <td>${fmtBytes(d.freeBytes)}</td>
        <td class="td-pct ${s}">${d.usedPercent}%</td>
      </tr>`;
  });

  return `
    <div class="machine-card" style="animation-delay:${delay}ms">
      <div class="card-header">
        ${pcIconSvg()}
        <span class="card-hostname">${data.computerName}</span>
        <div class="status-badge ${sev}">
          <span class="dot"></span>
          ${sevLabel(sev)}
        </div>
        <span class="drive-count-badge">${data.drives.length} meghajtó</span>
        <span class="card-date">${fmtDate(data.collectedAt)}</span>
      </div>

      <div class="card-body">
        <div class="card-body-title">Tárhely (minden meghajtó)</div>
        <div class="storage-layout">
          ${donutSvg(donutPct, donutLetter)}
          <div class="drive-table-wrap">
            <table class="drive-table">
              <thead>
                <tr>
                  <th>Drive</th>
                  <th>Type</th>
                  <th>Label</th>
                  <th>FS</th>
                  <th>Size</th>
                  <th>Used</th>
                  <th>Free</th>
                  <th>Used%</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <div class="footer-stat">
          <div class="footer-stat-label">Meghajtók</div>
          <div class="footer-stat-value">${data.drives.length}</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Összes tár</div>
          <div class="footer-stat-value">${fmtBytes(totalAll)}</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Foglalt</div>
          <div class="footer-stat-value">${pctAll}%</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Szabad</div>
          <div class="footer-stat-value free-color">${fmtBytes(freeAll)}</div>
        </div>
      </div>
    </div>`;
}

// ── Main loader ─────────────────────────────────────────────────
async function loadDashboard() {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');

  let fileList = [];

  try {
    const idxResp = await fetch(JSON_DIR + '/' + INDEX);
    if (idxResp.ok) {
      fileList = await idxResp.json();
      if (typeof fileList === 'string') fileList = [fileList];
    }
  } catch (_) {}

  // Fallback probe
  if (!fileList || fileList.length === 0) {
    const probe = [
      'WS-BUDAPEST-01.json','SRV-DB-PROD.json','SRV-FILES-02.json',
      'MININT-FC67EJM.json','DESKTOP-01.json','LAPTOP-01.json'
    ];
    fileList = [];
    for (const f of probe) {
      try {
        const r = await fetch(JSON_DIR + '/' + f, { method: 'HEAD' });
        if (r.ok) fileList.push(f);
      } catch (_) {}
    }
  }

  const machines = [];
  for (const f of fileList) {
    try {
      const r = await fetch(JSON_DIR + '/' + f);
      if (r.ok) machines.push(await r.json());
    } catch (_) {}
  }

  // Sort: critical → warn → ok, then alphabetical
  machines.sort(function(a, b) {
    var p = {crit:0, warn:1, ok:2};
    var sa = p[worstSeverity(a.drives)];
    var sb = p[worstSeverity(b.drives)];
    if (sa !== sb) return sa - sb;
    return a.computerName.localeCompare(b.computerName);
  });

  if (machines.length === 0) {
    grid.innerHTML =
      '<div class="empty" style="grid-column:1/-1">' +
      '<p>Nem található JSON fájl a <strong>/' + JSON_DIR + '/</strong> mappában.<br>' +
      'Futtasd a <code>Collect-DiskInfo.ps1</code> scriptet, majd másold ide a JSON-t.</p>' +
      '</div>';
    return;
  }

  meta.textContent = machines.length + ' gép  ·  frissítés: ' + new Date().toLocaleString('hu-HU');

  var html = '';
  for (var i = 0; i < machines.length; i++) {
    html += renderCard(machines[i], i * 100);
  }
  grid.innerHTML = html;
}

loadDashboard();
</script>

</body>
</html>
