<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disk Monitor – HealthCenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #080b12;
    --surface:     #0f1320;
    --surface-2:   #151a2c;
    --surface-3:   #1a2035;
    --border:      #1e2640;
    --border-hi:   #2a3456;
    --text:        #e2e6f0;
    --text-dim:    #6b7594;
    --text-muted:  #4a5270;
    --accent:      #4e9eff;
    --accent-dim:  #2a5a9e;
    --green:       #2dd4a0;
    --green-dim:   rgba(45,212,160,0.15);
    --yellow:      #f5b731;
    --yellow-dim:  rgba(245,183,49,0.15);
    --red:         #f0443e;
    --red-dim:     rgba(240,68,62,0.15);
    --donut-free:  #2dd4a0;
    --donut-used:  #f0443e;
    --radius:      12px;
    --radius-sm:   8px;
    --mono:        'IBM Plex Mono', monospace;
    --sans:        'Nunito', system-ui, sans-serif;
  }

  html { font-size: 14px; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Page Header ─────────────────────────────────────────────── */
  .page-header {
    max-width: 1500px;
    margin: 0 auto;
    padding: 2rem 2rem 0.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .page-header-left {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .page-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), #7c5cfc);
    border-radius: 10px;
    display: grid; place-items: center;
  }

  .page-logo svg { width: 20px; height: 20px; fill: #fff; }

  .page-title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .page-title span { color: var(--accent); }

  .page-subtitle {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .page-meta {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  /* ── Grid ─────────────────────────────────────────────────────── */
  .grid {
    max-width: 1500px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 0.85rem;
    align-items: start;
  }

  /* ── Machine Card ────────────────────────────────────────────── */
  .machine-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .machine-card:hover { border-color: var(--border-hi); }

  /* ── Card Header ─────────────────────────────────────────────── */
  .card-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.75rem 1rem;
    background: var(--surface-2);
    cursor: pointer;
    user-select: none;
  }

  .card-header:hover { background: var(--surface-3); }

  .pc-icon {
    width: 30px; height: 30px;
    flex-shrink: 0;
  }

  /* hostname + date stacked, fills remaining space */
  .card-main {
    flex: 1;
    min-width: 0;
  }

  .card-name-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .card-hostname {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.88rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  /* colored dot + drive count */
  .sev-pill {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .sev-pill .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sev-pill.ok   .dot { background: var(--green); }
  .sev-pill.warn .dot { background: var(--yellow); }
  .sev-pill.crit .dot { background: var(--red); }

  .sev-pill.ok   .sev-count { color: var(--green); }
  .sev-pill.warn .sev-count { color: var(--yellow); }
  .sev-pill.crit .sev-count { color: var(--red); }

  .card-date {
    font-family: var(--mono);
    font-size: 0.67rem;
    color: var(--text-muted);
    margin-top: 0.18rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Card Body: Donut + Table layout ─────────────────────────── */
  .card-body {
    padding: 1.25rem 1.5rem;
  }

  .card-body-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 1rem;
    letter-spacing: 0.03em;
  }

  .storage-layout {
    display: flex;
    gap: 2rem;
    align-items: flex-start;
  }

  /* ── Donut Chart (matches Image 2) ───────────────────────────── */
  .donut-wrap {
    flex-shrink: 0;
    position: relative;
    width: 170px;
    height: 170px;
  }

  .donut-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .donut-wrap circle {
    fill: none;
    stroke-width: 22;
  }

  .donut-track { stroke: var(--surface-3); }

  .donut-fill {
    stroke-linecap: round;
  }

  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .donut-letter {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--text);
  }

  .donut-pct {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
    line-height: 1.1;
  }

  .donut-label-text {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }

  /* Multi-drive donut: show worst / overall */
  .donut-multi .donut-letter { font-size: 0.72rem; }

  /* ── Drive Table (matches Image 2 bottom) ────────────────────── */
  .drive-table-wrap {
    flex: 1;
    overflow-x: auto;
  }

  .drive-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  .drive-table thead th {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.5rem 0.6rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .drive-table tbody td {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.6rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    color: var(--text);
  }

  .drive-table tbody tr:last-child td { border-bottom: none; }

  .drive-table tbody tr:hover {
    background: var(--surface-2);
  }

  .td-drive {
    font-weight: 700;
    color: var(--accent);
  }

  .td-pct { font-weight: 700; }
  .td-pct.ok   { color: var(--green); }
  .td-pct.warn { color: var(--yellow); }
  .td-pct.crit { color: var(--red); }

  .td-type, .td-label, .td-fs {
    color: var(--text-dim);
  }

  /* ── Summary footer ──────────────────────────────────────────── */
  .card-footer {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
  }

  .footer-stat {
    flex: 1;
    padding: 0.75rem 1rem;
    text-align: center;
    border-right: 1px solid var(--border);
  }

  .footer-stat:last-child { border-right: none; }

  .footer-stat-label {
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.15rem;
  }

  .footer-stat-value {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.9rem;
  }

  .footer-stat-value.free-color { color: var(--green); }

  /* ── Empty / Loading ─────────────────────────────────────────── */
  .empty, .loading {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--text-dim);
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty p { max-width: 420px; margin: 0 auto; line-height: 1.7; }
  .empty code { background: var(--surface-2); padding: 0.15rem 0.45rem; border-radius: 4px; font-family: var(--mono); font-size: 0.85rem; }

  /* ── Active (selected) card ──────────────────────────────────── */
  .machine-card.selected {
    border-color: var(--green);
  }

  /* ── Clickable card header ───────────────────────────────────── */
  .card-header {
    cursor: pointer;
    user-select: none;
    transition: background 0.18s;
  }

  .card-header:hover { background: var(--surface-3); }

  /* ── Modal overlay ───────────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 11, 18, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius);
    width: 100%;
    max-width: 920px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transform: translateY(10px);
    transition: transform 0.18s ease-out;
    will-change: transform;
  }

  .modal-overlay.open .modal-card {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.85rem 1.25rem;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .modal-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.25rem;
    border-radius: 6px;
    display: flex;
    align-items: center;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .modal-close:hover { color: var(--text); background: var(--surface-3); }
  .modal-close svg { width: 18px; height: 18px; }

  /* ── Modal two-column body ───────────────────────────────────── */
  .modal-cols {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--border);
  }

  .modal-col-left {
    flex: 1;
    border-right: 1px solid var(--border);
    padding: 1.1rem 1.5rem;
    min-width: 0;
  }

  .modal-col-right {
    flex: 1.4;
    padding: 1.1rem 1.5rem;
    min-width: 0;
  }

  /* ── Section blocks inside modal ─────────────────────────────── */
  .section-block {
    padding: 1.1rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .section-block:last-child { border-bottom: none; }

  .section-label {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.85rem;
  }

  /* ── Overview tiles ──────────────────────────────────────────── */
  .overview-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
  }

  .ov-tile {
    flex: 1;
    min-width: 110px;
    background: var(--surface-3);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius-sm);
    padding: 0.7rem 1rem;
  }

  .ov-tile.ok      { border-color: rgba(45,212,160,0.35); background: rgba(45,212,160,0.06); }
  .ov-tile.warn    { border-color: rgba(245,183,49,0.35);  background: rgba(245,183,49,0.06); }
  .ov-tile.crit    { border-color: rgba(240,68,62,0.35);   background: rgba(240,68,62,0.06); }
  .ov-tile.neutral { border-color: var(--border-hi); }

  .ov-value {
    font-family: var(--mono);
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 0.3rem;
  }

  .ov-tile.ok      .ov-value { color: var(--green); }
  .ov-tile.warn    .ov-value { color: var(--yellow); }
  .ov-tile.crit    .ov-value { color: var(--red); }
  .ov-tile.neutral .ov-value { color: var(--text); }

  .ov-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  /* ── Per-drive tiles ─────────────────────────────────────────── */
  .drives-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
  }

  .drive-tile {
    background: var(--surface-3);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius-sm);
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    min-width: 190px;
    flex: 1;
    max-width: 260px;
  }

  .drive-tile.ok   { border-color: rgba(45,212,160,0.3); }
  .drive-tile.warn { border-color: rgba(245,183,49,0.3); }
  .drive-tile.crit { border-color: rgba(240,68,62,0.3); }

  .mini-donut-wrap {
    position: relative;
    width: 52px; height: 52px;
    flex-shrink: 0;
  }

  .mini-donut-wrap svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .mini-donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--text);
  }

  .drive-tile-info { flex: 1; min-width: 0; }

  .drive-tile-letter {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    line-height: 1;
  }

  .drive-tile-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin: 0.2rem 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .drive-tile-sizes {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .drive-tile-pct {
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    text-align: right;
    flex-shrink: 0;
  }

  .drive-tile-pct.ok   { color: var(--green); }
  .drive-tile-pct.warn { color: var(--yellow); }
  .drive-tile-pct.crit { color: var(--red); }

  /* ── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .modal-cols { flex-direction: column; }
    .modal-col-left { border-right: none; border-bottom: 1px solid var(--border); }
  }

  @media (max-width: 700px) {
    .page-header { padding: 1.25rem 1rem 0.5rem; }
    .grid { padding: 1rem 1rem 2rem; grid-template-columns: 1fr; }
    .storage-layout { flex-direction: column; align-items: center; }
    .donut-wrap { width: 150px; height: 150px; }
    .card-footer { flex-wrap: wrap; }
    .footer-stat { min-width: 50%; border-bottom: 1px solid var(--border); }
    .overview-grid { gap: 0.5rem; }
    .ov-tile { min-width: 90px; }
  }

  @media (max-width: 420px) {
    html { font-size: 13px; }
    .card-header { flex-wrap: wrap; gap: 0.4rem; }
    .card-date { width: 100%; margin-top: 0.25rem; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-header-left">
    <div class="page-logo">
      <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm5 14h6m-3-4v4"/><rect x="4" y="4" width="16" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="12" y1="16" x2="12" y2="20" stroke="#fff" stroke-width="1.5"/><line x1="9" y1="20" x2="15" y2="20" stroke="#fff" stroke-width="1.5"/></svg>
    </div>
    <div>
      <div class="page-title">Disk <span>Monitor</span></div>
      <div class="page-subtitle">HealthCenter</div>
    </div>
  </div>
  <div class="page-meta" id="meta"></div>
</div>

<div class="grid" id="grid">
  <div class="loading">
    <div class="spinner"></div>
    <p>JSON fájlok betöltése…</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="overlayClick(event)">
  <div class="modal-card" id="modalCard">
    <div class="modal-header" id="modalHeader"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ================================================================
   Disk Monitor Dashboard  –  reads every .json from  ./json/
   ================================================================ */

const JSON_DIR = 'json';
const INDEX    = 'index.json';

// ── Helpers ─────────────────────────────────────────────────────
function fmtBytes(b) {
  if (b === 0) return '0 B';
  const u = ['B','KB','MB','GB','TB','PB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(2) + ' ' + u[i];
}

function severity(pct) {
  if (pct >= 90) return 'crit';
  if (pct >= 75) return 'warn';
  return 'ok';
}

function sevLabel(s) {
  return s === 'crit' ? 'Kritikus' : s === 'warn' ? 'Figyelem' : 'Rendben';
}

function worstSeverity(drives) {
  return severity(Math.max(...drives.map(d => d.usedPercent)));
}

function donutColor(pct) {
  if (pct >= 90) return '#f0443e';
  if (pct >= 75) return '#f5b731';
  return '#2dd4a0';
}

function freeColor(pct) {
  if (pct >= 90) return '#f0443e';
  if (pct >= 75) return '#f5b731';
  return '#2dd4a0';
}

// ── Date formatting ─────────────────────────────────────────────
function fmtDate(dateStr) {
  // "2026-05-06 14:32:10" → "Generálva: 2026. 05. 06. 14:32:10"
  const parts = dateStr.split(' ');
  const d = parts[0].replace(/-/g, '. ') + '.';
  const t = parts[1] || '';
  return 'Generálva: ' + d + ' ' + t;
}

// ── SVG PC Icon ─────────────────────────────────────────────────
function pcIconSvg() {
  return `<svg class="pc-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="8" width="52" height="34" rx="4" fill="#1a2035" stroke="#4e9eff" stroke-width="2"/>
    <rect x="10" y="12" width="44" height="26" rx="2" fill="#0c1424" stroke="#2a3456" stroke-width="1"/>
    <circle cx="32" cy="25" r="3" fill="#4e9eff" opacity="0.6"/>
    <rect x="24" y="42" width="16" height="4" rx="1" fill="#2a3456"/>
    <rect x="18" y="46" width="28" height="3" rx="1.5" fill="#1a2035" stroke="#2a3456" stroke-width="1"/>
    <circle cx="14" cy="38" r="1.5" fill="#2dd4a0" opacity="0.8"/>
  </svg>`;
}

// ── Donut SVG ───────────────────────────────────────────────────
function donutSvg(pct, letter) {
  const r = 50;
  const c = Math.PI * 2 * r;
  const filled = (pct / 100) * c;
  const free   = c - filled;
  const color  = donutColor(pct);
  const freeC  = freeColor(pct) === '#2dd4a0' ? '#2dd4a0' : '#1a4a3a';

  return `
    <div class="donut-wrap${letter ? '' : ' donut-multi'}">
      <svg viewBox="0 0 130 130">
        <circle class="donut-track" cx="65" cy="65" r="${r}" stroke-width="22"/>
        <circle class="donut-fill"  cx="65" cy="65" r="${r}" stroke-width="22"
          stroke="${color}"
          stroke-dasharray="${filled} ${free}"
          stroke-linecap="round"/>
        <!-- free arc on top as green overlay -->
      </svg>
      <div class="donut-center">
        <span class="donut-letter">${letter || 'Össz.'}</span>
        <span class="donut-pct">${pct}%</span>
      </div>
    </div>`;
}

// ── Mini donut SVG ───────────────────────────────────────────────
function miniDonutSvg(pct) {
  const r = 18, circ = Math.PI * 2 * r;
  const color = donutColor(pct);
  return `<svg viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="#1a2035" stroke-width="7"/>
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${(pct/100)*circ} ${circ}" stroke-linecap="round"
      transform="rotate(-90 22 22)"/>
  </svg>`;
}

// ── Render compact list card ─────────────────────────────────────
function renderCard(data, idx) {
  const sev = worstSeverity(data.drives);
  return `
    <div class="machine-card" onclick="openModal(${idx})">
      <div class="card-header">
        ${pcIconSvg()}
        <div class="card-main">
          <div class="card-name-row">
            <span class="card-hostname">${data.computerName}</span>
            <span class="sev-pill ${sev}">
              <span class="dot"></span>
              <span class="sev-count">${data.drives.length}</span>
            </span>
          </div>
          <div class="card-date">${fmtDate(data.collectedAt)}</div>
        </div>
      </div>
    </div>`;
}

// ── Build modal detail content for one machine ───────────────────
function buildModalContent(data) {
  const sev = worstSeverity(data.drives);

  let totalAll = 0, usedAll = 0, freeAll = 0;
  data.drives.forEach(d => { totalAll += d.totalBytes; usedAll += d.usedBytes; freeAll += d.freeBytes; });
  const pctAll = totalAll > 0 ? ((usedAll / totalAll) * 100).toFixed(2) : 0;
  const worstDrive = data.drives.reduce((a, b) => a.usedPercent > b.usedPercent ? a : b);
  const donutLetter = data.drives.length === 1 ? data.drives[0].letter : '';
  const donutPct    = data.drives.length === 1 ? data.drives[0].usedPercent : parseFloat(pctAll);

  // Header
  const header = `
    ${pcIconSvg()}
    <span class="card-hostname">${data.computerName}</span>
    <div class="status-badge ${sev}"><span class="dot"></span>${sevLabel(sev)}</div>
    <span class="drive-count-badge">${data.drives.length} meghajtó</span>
    <span class="card-date">${fmtDate(data.collectedAt)}</span>
    <button class="modal-close" onclick="closeModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>`;

  // Overview tiles
  const overview = `
    <div class="section-block">
      <div class="section-label">Áttekintés</div>
      <div class="overview-grid">
        <div class="ov-tile neutral">
          <div class="ov-value">${data.drives.length}</div>
          <div class="ov-label">Meghajtó</div>
        </div>
        <div class="ov-tile neutral">
          <div class="ov-value" style="font-size:1rem">${fmtBytes(totalAll)}</div>
          <div class="ov-label">Összes tár</div>
        </div>
        <div class="ov-tile ${severity(parseFloat(pctAll))}">
          <div class="ov-value">${pctAll}%</div>
          <div class="ov-label">Átlagos telítettség</div>
        </div>
        <div class="ov-tile ${severity(worstDrive.usedPercent)}">
          <div class="ov-value">${worstDrive.letter} ${worstDrive.usedPercent}%</div>
          <div class="ov-label">Legtelítettebb</div>
        </div>
        <div class="ov-tile ok">
          <div class="ov-value" style="font-size:1rem">${fmtBytes(freeAll)}</div>
          <div class="ov-label">Szabad összesen</div>
        </div>
      </div>
    </div>`;

  // Left column: per-drive mini tiles
  let driveTiles = '';
  data.drives.forEach(d => {
    const s = severity(d.usedPercent);
    driveTiles += `
      <div class="drive-tile ${s}">
        <div class="mini-donut-wrap">
          ${miniDonutSvg(d.usedPercent)}
          <div class="mini-donut-center">${d.usedPercent}%</div>
        </div>
        <div class="drive-tile-info">
          <div class="drive-tile-letter">${d.letter}</div>
          <div class="drive-tile-label">${d.label || d.fileSystem || 'Local'}</div>
          <div class="drive-tile-sizes">
            ${fmtBytes(d.usedBytes)} / ${fmtBytes(d.totalBytes)}<br>
            Szabad: ${fmtBytes(d.freeBytes)}
          </div>
        </div>
        <div class="drive-tile-pct ${s}">${d.usedPercent}%</div>
      </div>`;
  });

  // Right column: big donut + table
  let rows = '';
  data.drives.forEach(d => {
    const s = severity(d.usedPercent);
    rows += `<tr>
      <td class="td-drive">${d.letter}</td>
      <td class="td-type">${d.type || 'Local'}</td>
      <td class="td-label">${d.label || '—'}</td>
      <td class="td-fs">${d.fileSystem || '—'}</td>
      <td>${fmtBytes(d.totalBytes)}</td>
      <td>${fmtBytes(d.usedBytes)}</td>
      <td>${fmtBytes(d.freeBytes)}</td>
      <td class="td-pct ${s}">${d.usedPercent}%</td>
    </tr>`;
  });

  const colsHtml = `
    <div class="modal-cols">
      <div class="modal-col-left">
        <div class="section-label">Meghajtók</div>
        <div class="drives-grid">${driveTiles}</div>
      </div>
      <div class="modal-col-right">
        <div class="section-label">Tárhely részletek</div>
        <div class="storage-layout">
          ${donutSvg(donutPct, donutLetter)}
          <div class="drive-table-wrap">
            <table class="drive-table">
              <thead><tr>
                <th>Drive</th><th>Type</th><th>Label</th><th>FS</th>
                <th>Size</th><th>Used</th><th>Free</th><th>Used%</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;

  // Footer
  const footer = `
    <div class="card-footer">
      <div class="footer-stat">
        <div class="footer-stat-label">Meghajtók</div>
        <div class="footer-stat-value">${data.drives.length}</div>
      </div>
      <div class="footer-stat">
        <div class="footer-stat-label">Összes tár</div>
        <div class="footer-stat-value">${fmtBytes(totalAll)}</div>
      </div>
      <div class="footer-stat">
        <div class="footer-stat-label">Foglalt</div>
        <div class="footer-stat-value">${pctAll}%</div>
      </div>
      <div class="footer-stat">
        <div class="footer-stat-label">Szabad</div>
        <div class="footer-stat-value free-color">${fmtBytes(freeAll)}</div>
      </div>
    </div>`;

  return { header, body: overview + colsHtml + footer };
}

// ── Modal open / close ───────────────────────────────────────────
let machinesData = [];
let activeCardIdx = -1;

function openModal(idx) {
  // Remove previous selection
  if (activeCardIdx >= 0) {
    const prev = document.querySelector('.machine-card.selected');
    if (prev) prev.classList.remove('selected');
  }
  activeCardIdx = idx;

  // Highlight clicked card
  const cards = document.querySelectorAll('.machine-card');
  if (cards[idx]) cards[idx].classList.add('selected');

  const data = machinesData[idx];
  const { header, body } = buildModalContent(data);
  document.getElementById('modalHeader').innerHTML = header;
  document.getElementById('modalBody').innerHTML   = body;
  document.getElementById('modalCard').scrollTop   = 0;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  // Remove green highlight
  const sel = document.querySelector('.machine-card.selected');
  if (sel) sel.classList.remove('selected');
  activeCardIdx = -1;
}

function overlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Main loader ─────────────────────────────────────────────────
async function loadDashboard() {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');

  let fileList = [];

  try {
    const idxResp = await fetch(JSON_DIR + '/' + INDEX);
    if (idxResp.ok) {
      fileList = await idxResp.json();
      if (typeof fileList === 'string') fileList = [fileList];
    }
  } catch (_) {}

  if (!fileList || fileList.length === 0) {
    const probe = [
      'WS-BUDAPEST-01.json','SRV-DB-PROD.json','SRV-FILES-02.json',
      'MININT-FC67EJM.json','DESKTOP-01.json','LAPTOP-01.json'
    ];
    // parallel HEAD requests
    const hits = await Promise.all(probe.map(f =>
      fetch(JSON_DIR + '/' + f, { method: 'HEAD' })
        .then(r => r.ok ? f : null).catch(() => null)
    ));
    fileList = hits.filter(Boolean);
  }

  // parallel JSON downloads
  const results = await Promise.all(fileList.map(f =>
    fetch(JSON_DIR + '/' + f)
      .then(r => r.ok ? r.json() : null).catch(() => null)
  ));
  machinesData = results.filter(Boolean);

  machinesData.sort(function(a, b) {
    var p = {crit:0, warn:1, ok:2};
    var sa = p[worstSeverity(a.drives)];
    var sb = p[worstSeverity(b.drives)];
    if (sa !== sb) return sa - sb;
    return a.computerName.localeCompare(b.computerName);
  });

  if (machinesData.length === 0) {
    grid.innerHTML =
      '<div class="empty"><p>Nem található JSON fájl a <strong>/' + JSON_DIR +
      '/</strong> mappában.<br>Futtasd a <code>Collect-DiskInfo.ps1</code> scriptet.</p></div>';
    return;
  }

  meta.textContent = machinesData.length + ' gép  ·  frissítés: ' + new Date().toLocaleString('hu-HU');

  var html = '';
  for (var i = 0; i < machinesData.length; i++) {
    html += renderCard(machinesData[i], i);
  }
  grid.innerHTML = html;
}

loadDashboard();
</script>
